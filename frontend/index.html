<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agninetra National Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/css/national-map.css" />
</head>
<body>
  <div id="map"></div>

  <section id="classes-panel" class="panel" aria-label="Classes">
    <h1>Thermal detections, India</h1>
    <div id="class-toggles"></div>
    <p id="status" role="status">Loading detections...</p>
    <a class="subtle-link" href="/legacy/">Classic demo view</a>
  </section>

  <section id="alerts-panel" class="panel" aria-labelledby="alerts-title">
    <header class="alerts-header">
      <h2 id="alerts-title">Alerts <span id="alerts-count" class="alerts-count">…</span></h2>
      <button id="alerts-toggle" type="button" aria-controls="alerts-list" aria-expanded="true">Hide</button>
    </header>
    <p class="alerts-note">Newest first. Starting thresholds, not yet validated.</p>
    <div id="alerts-filters" class="alerts-filters" role="group" aria-label="Filter alerts by type"></div>
    <div id="alerts-list" class="alerts-list"><p class="alerts-empty">Loading alerts…</p></div>
  </section>

  <section id="time-panel" class="panel" aria-label="Time">
    <button id="play" type="button" aria-label="Play months">&#9654;</button>
    <input id="month-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Month" />
    <output id="month-label" for="month-slider"></output>
    <label class="all-year"><input id="all-year" type="checkbox" /> All year</label>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.14/dist.min.js"></script>
  <script src="/static/js/alerts-panel.js"></script>
  <script src="/static/js/national-map.js"></script>
</body>
</html>
